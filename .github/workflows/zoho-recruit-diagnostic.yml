name: Zoho Recruit Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Query Zoho Recruit Job Openings
        env:
          ZOHO_ACCOUNTS_URL: ${{ secrets.ZOHO_ACCOUNTS_URL }}
          ZOHO_RECRUIT_API_BASE_URL: ${{ secrets.ZOHO_RECRUIT_API_BASE_URL }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_RECRUIT_REFRESH_TOKEN: ${{ secrets.ZOHO_RECRUIT_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ZOHO_ACCOUNTS_URL="${ZOHO_ACCOUNTS_URL:-https://accounts.zoho.in}"
          ZOHO_RECRUIT_API_BASE_URL="${ZOHO_RECRUIT_API_BASE_URL:-https://recruit.zoho.in/recruit/v2}"

          if [[ -z "${ZOHO_CLIENT_ID:-}" || -z "${ZOHO_CLIENT_SECRET:-}" || -z "${ZOHO_RECRUIT_REFRESH_TOKEN:-}" ]]; then
            echo "Missing one or more required Zoho secrets."
            exit 1
          fi

          token_response=$(curl -fsS -X POST "${ZOHO_ACCOUNTS_URL}/oauth/v2/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "refresh_token=${ZOHO_RECRUIT_REFRESH_TOKEN}" \
            --data-urlencode "client_id=${ZOHO_CLIENT_ID}" \
            --data-urlencode "client_secret=${ZOHO_CLIENT_SECRET}" \
            --data-urlencode 'grant_type=refresh_token')

          access_token=$(python -c 'import json,sys; p=json.loads(sys.argv[1]); v=p.get("access_token"); print(v) if v else (print(p.get("error") or p.get("message") or "No access token returned", file=sys.stderr), sys.exit(1))' "$token_response")

          openings=$(curl -fsS "${ZOHO_RECRUIT_API_BASE_URL}/JobOpenings" \
            -H "Authorization: Zoho-oauthtoken ${access_token}")

          python -c 'import json,sys; p=json.loads(sys.argv[1]); rows=p.get("data") or []; print("Zoho Recruit Job Openings:"); [print(f"- {r.get("Job_Opening_Name") or r.get("Posting_Title") or r.get("Name") or "Unnamed"} | id={r.get("id") or r.get("ID") or r.get("Job_Opening_ID")} | status={r.get("Job_Opening_Status") or ""}") for r in rows]' "$openings"
