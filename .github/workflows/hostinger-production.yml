name: AionSi Hostinger Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify Astro server output
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking generated Astro server output..."
          test -f dist/server/entry.mjs || { echo "Missing dist/server/entry.mjs"; find dist -maxdepth 3 -type f | sort | head -200; exit 1; }
          echo "Checking generated client manifest..."
          test -f dist/client/manifest.json || { echo "Missing dist/client/manifest.json"; find dist -maxdepth 3 -type f | sort | head -200; exit 1; }

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          tar -czf aionsi-hostinger-deploy.tar.gz dist package.json package-lock.json scripts/start-hostinger.mjs
          ls -lh aionsi-hostinger-deploy.tar.gz

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: aionsi-hostinger-deploy
          path: aionsi-hostinger-deploy.tar.gz
          retention-days: 7

  verify-package:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment handoff
        run: |
          echo "Production build and packaging completed successfully."
          echo "Hostinger should consume the aionsi-hostinger-deploy artifact or have Git deployment configured for the main branch."
          echo "Production verification target: /api/health"
          echo "Production verification target: /insights/when-a-display-becomes-a-computing-platform"
