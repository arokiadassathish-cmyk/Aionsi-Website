name: AionSi Hostinger Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify Astro server output
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking generated Astro server output..."
          test -f dist/server/entry.mjs || { echo "Missing dist/server/entry.mjs"; find dist -maxdepth 3 -type f | sort | head -200; exit 1; }
          echo "Checking generated client assets..."
          test -d dist/client || { echo "Missing dist/client"; find dist -maxdepth 3 -type f | sort | head -200; exit 1; }
          test -d dist/client/_astro || { echo "Missing dist/client/_astro"; find dist/client -maxdepth 2 -type f | sort | head -100; exit 1; }
          echo "Astro production output verified."

      - name: Verify target-account and admin routes in build
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying target-account content and admin target dashboard are present..."
          test -f dist/server/entry.mjs
          grep -R "GreatAsic" dist/server dist/client >/dev/null || { echo "GreatAsic route/content missing from build"; exit 1; }
          grep -R "Oppstar" dist/server dist/client >/dev/null || { echo "Oppstar route/content missing from build"; exit 1; }
          grep -R "Target configuration" dist/server dist/client >/dev/null || { echo "Admin target configuration route missing from build"; exit 1; }
          echo "Target account and admin configuration content detected in production output."

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          tar -czf aionsi-hostinger-deploy.tar.gz dist package.json package-lock.json scripts/start-hostinger.mjs
          ls -lh aionsi-hostinger-deploy.tar.gz

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: aionsi-hostinger-deploy
          path: aionsi-hostinger-deploy.tar.gz
          retention-days: 7

  verify-package:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Report Hostinger deployment handoff
        run: |
          echo "Production build and packaging completed successfully."
          echo "For managed Hostinger Node.js hosting, connect this repository and the main branch in Hostinger's GitHub deployment settings."
          echo "After the one-time connection, pushes to main trigger Hostinger redeployment automatically."
          echo "Expected production verification targets: /api/health, /oppstar, /greatasic, /admin/campaigns/targets"

  live-smoke:
    needs: build-and-package
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Wait for Hostinger GitHub deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://aionsi.com/admin/campaigns/targets"
          echo "Polling $url for the new production deployment..."
          for attempt in $(seq 1 12); do
            status=$(curl -L -sS -o /tmp/target-page.html -w '%{http_code}' --max-time 20 "$url" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ] && grep -q "Target configuration" /tmp/target-page.html; then
              echo "Target configuration page is live."
              exit 0
            fi
            sleep 15
          done
          echo "Live smoke check did not observe the new target dashboard yet."
          echo "This is non-blocking because Hostinger deployment may not be connected to GitHub yet."
