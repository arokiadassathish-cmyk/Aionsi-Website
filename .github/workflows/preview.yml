name: AionSi Preview Build

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full website QA
        run: npm run qa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aionsi-preview-build
          path: dist/
          retention-days: 7
